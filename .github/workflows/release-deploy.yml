name: Release & Deploy

on:
  push:
    branches: [main]

# Never cancel a running deploy — let it finish or fail cleanly.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_MCP: ghcr.io/romandots/slonk/mcp-kanban
  IMAGE_BACKUP: ghcr.io/romandots/slonk/backup
  IMAGE_PLANE_BACKEND: ghcr.io/romandots/slonk/plane-backend

jobs:
  gate:
    name: Gate (Lint + Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-kanban
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp-kanban/.nvmrc
          cache: pnpm
          cache-dependency-path: mcp-kanban/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  release:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      plane_backend_tag: ${{ steps.plane.outputs.patched }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('mcp-kanban/package.json','utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push mcp-kanban
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-kanban
          push: true
          tags: |
            ${{ env.IMAGE_MCP }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_MCP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backup
        uses: docker/build-push-action@v6
        with:
          context: ./backup
          push: true
          tags: |
            ${{ env.IMAGE_BACKUP }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_BACKUP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SLONK-32: backend Plane — upstream + патч S3Storage. Тег берём из
      # .env.example, чтобы образ в GHCR всегда соответствовал тому, на что
      # ссылается compose в этом же коммите. Версия mcp-kanban тут ни при
      # чём: образ меняется только при бампе upstream или набора патчей.
      - name: Read Plane image tags from .env.example
        id: plane
        run: |
          UPSTREAM=$(grep -E '^PLANE_IMAGE_TAG=' .env.example | cut -d= -f2)
          PATCHED=$(grep -E '^PLANE_BACKEND_TAG=' .env.example | cut -d= -f2)
          test -n "$UPSTREAM" && test -n "$PATCHED"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "patched=$PATCHED" >> "$GITHUB_OUTPUT"

      - name: Build & push plane-backend (patched)
        uses: docker/build-push-action@v6
        with:
          context: ./plane-backend
          push: true
          tags: ${{ env.IMAGE_PLANE_BACKEND }}:${{ steps.plane.outputs.patched }}
          build-args: |
            PLANE_IMAGE_TAG=${{ steps.plane.outputs.upstream }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE_MCP: ${{ env.IMAGE_MCP }}
          IMAGE_PLANE_BACKEND: ${{ env.IMAGE_PLANE_BACKEND }}
          PLANE_BACKEND_TAG: ${{ needs.release.outputs.plane_backend_tag }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_DIR: /home/romandots/slonik
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VERSION,IMAGE_MCP,IMAGE_PLANE_BACKEND,PLANE_BACKEND_TAG,GHCR_PULL_TOKEN,GH_ACTOR,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # Login to GHCR for pulling
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # SLONK-32: compose теперь ссылается на PLANE_BACKEND_*, поэтому
            # рабочая копия обязана быть свежей. Синхронизация мягкая: если
            # каталог не git-клон или ff-only не проходит (локальные правки,
            # расхождение с main), выкат mcp-kanban идёт как раньше, а backend
            # пропускается с явным сообщением — молча деплоить из устаревшего
            # compose хуже, чем не деплоить.
            BACKEND_DEPLOYABLE=1
            if git rev-parse --git-dir >/dev/null 2>&1; then
              if git pull --ff-only; then
                echo "Working copy synced with origin"
              else
                echo "WARNING: git pull --ff-only failed — рабочая копия расходится с main"
                echo "WARNING: выкат plane-backend пропущен, разберите расхождение руками"
                BACKEND_DEPLOYABLE=0
              fi
            else
              echo "WARNING: $DEPLOY_DIR не git-клон — выкат plane-backend пропущен"
              BACKEND_DEPLOYABLE=0
            fi

            # Значения .env правим через sed с разделителем `|`: в образе есть
            # слэши (ghcr.io/...), с `/` подстановка бы развалилась.
            set_env() {
              if grep -q "^$1=" .env 2>/dev/null; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                # `.env` может не заканчиваться переводом строки — тогда
                # простой append приклеил бы новую переменную к последней
                # строке файла и незаметно испортил её значение.
                if [ -s .env ] && [ -n "$(tail -c1 .env)" ]; then
                  printf '\n' >> .env
                fi
                echo "$1=$2" >> .env
              fi
            }

            # Record current tags for rollback (снимаем ДО правки .env)
            PREV_TAG=$(grep "^SLONK_MCP_IMAGE_TAG=" .env 2>/dev/null | cut -d= -f2 | tr -d '"' || echo "")
            PREV_PLANE_TAG=$(grep "^PLANE_BACKEND_TAG=" .env 2>/dev/null | cut -d= -f2 | tr -d '"' || echo "")
            echo "Previous tag: ${PREV_TAG:-<not set>}"
            echo "Previous plane-backend tag: ${PREV_PLANE_TAG:-<not set>}"

            # Pull new image from GHCR and retag for docker compose
            docker pull "${IMAGE_MCP}:${VERSION}"
            docker tag "${IMAGE_MCP}:${VERSION}" "slonk/mcp-kanban:${VERSION}"

            # Deploy with health gate
            if SLONK_MCP_IMAGE_TAG="$VERSION" docker compose up -d mcp-kanban --wait; then
              echo "Version $VERSION deployed successfully"
              # Persist new tag so future manual restarts use it
              set_env SLONK_MCP_IMAGE_TAG "$VERSION"
            else
              echo "Health check failed — rolling back to ${PREV_TAG:-previous}"
              if [ -n "$PREV_TAG" ]; then
                SLONK_MCP_IMAGE_TAG="$PREV_TAG" docker compose up -d mcp-kanban
                echo "Rolled back to $PREV_TAG"
              fi
              exit 1
            fi

            # ---------------------------------------------------------------
            # SLONK-32: пропатченный plane-backend.
            #
            # Выкат идемпотентен: Plane перезапускается только когда работающий
            # образ отличается от целевого, иначе каждый push в main ребутил бы
            # API/worker/beat — в том числе на docs-only коммитах.
            # ---------------------------------------------------------------
            if [ "$BACKEND_DEPLOYABLE" != "1" ]; then
              echo "plane-backend: выкат пропущен (см. WARNING выше)"
            else
              TARGET_BACKEND="${IMAGE_PLANE_BACKEND}:${PLANE_BACKEND_TAG}"
              RUNNING_ID=$(docker compose ps -q plane-api 2>/dev/null || echo "")
              CURRENT_BACKEND=""
              if [ -n "$RUNNING_ID" ]; then
                CURRENT_BACKEND=$(docker inspect --format '{{.Config.Image}}' "$RUNNING_ID" 2>/dev/null || echo "")
              fi

              if [ "$CURRENT_BACKEND" = "$TARGET_BACKEND" ]; then
                echo "plane-backend уже на $TARGET_BACKEND — перезапуск не нужен"
              else
                echo "plane-backend: ${CURRENT_BACKEND:-<not running>} -> $TARGET_BACKEND"
                set_env PLANE_BACKEND_IMAGE "$IMAGE_PLANE_BACKEND"
                set_env PLANE_BACKEND_TAG "$PLANE_BACKEND_TAG"

                docker compose pull plane-migrator plane-api plane-worker plane-beat

                # plane-migrator поднимать отдельно не нужно: plane-api зависит
                # от него через service_completed_successfully, поэтому compose
                # сам прогонит миграции и дождётся их завершения.
                if docker compose up -d plane-api plane-worker plane-beat --wait; then
                  echo "plane-backend $PLANE_BACKEND_TAG deployed"
                else
                  echo "plane-backend health check failed"
                  if [ -n "$PREV_PLANE_TAG" ] && [ "$PREV_PLANE_TAG" != "$PLANE_BACKEND_TAG" ]; then
                    echo "Rolling back plane-backend to $PREV_PLANE_TAG"
                    set_env PLANE_BACKEND_TAG "$PREV_PLANE_TAG"
                    docker compose up -d plane-api plane-worker plane-beat
                    echo "Rolled back to $PREV_PLANE_TAG"
                  else
                    echo "Откатывать некуда: предыдущего тега в .env нет"
                  fi
                  exit 1
                fi
              fi
            fi

      - name: Post-deploy smoke
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: /home/romandots/slonik
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            curl --fail --silent --show-error http://localhost:8787/health >/dev/null

            cd "$DEPLOY_DIR"

            # Если оператор включил OAuth, AS обязан быть поднят: без него
            # remote-коннектор claude.ai падает на discovery, не доходя до
            # формы логина, а снаружи сервер выглядит живым (/health 200,
            # /mcp 401). Именно так испорченная строка в .env один раз уже
            # выключила OAuth незаметно.
            if grep -q '^MCP_OAUTH_ENABLED=true' .env 2>/dev/null; then
              if curl --fail --silent --show-error \
                   http://localhost:8787/.well-known/oauth-protected-resource >/dev/null; then
                echo "OAuth discovery OK"
              else
                echo "ОШИБКА: MCP_OAUTH_ENABLED=true, но /.well-known/oauth-protected-resource недоступен" >&2
                echo "Проверь .env: значение переменной могло быть испорчено" >&2
                exit 1
              fi
            fi

            # SLONK-32: убеждаемся, что backend работает с пропатченным
            # S3Storage. Без патча сигнатура — (self, request=None), и весь
            # публичный API ассетов Plane отвечает 500. Проверка мягкая к
            # состоянию хоста: если backend не наш или не поднят (см. WARNING
            # на шаге деплоя), молча пропускаем, а не роняем smoke.
            cd "$DEPLOY_DIR"
            PLANE_API_ID=$(docker compose ps -q plane-api 2>/dev/null || echo "")
            if [ -z "$PLANE_API_ID" ]; then
              echo "plane-api не запущен — проверку патча пропускаем"
            elif ! docker inspect --format '{{.Config.Image}}' "$PLANE_API_ID" | grep -q 'plane-backend'; then
              echo "plane-api поднят не из slonk-образа — проверку патча пропускаем"
            else
              docker compose exec -T plane-api python3 -c \
                "import inspect, plane.settings.storage as m; \
                 sig = str(inspect.signature(m.S3Storage.__init__)); \
                 assert 'is_server' in sig, 'S3Storage не пропатчен: ' + sig; \
                 print('S3Storage OK:', sig)"
            fi
