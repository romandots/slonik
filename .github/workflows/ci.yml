name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-kanban
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp-kanban/.nvmrc
          cache: pnpm
          cache-dependency-path: mcp-kanban/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-kanban
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp-kanban/.nvmrc
          cache: pnpm
          cache-dependency-path: mcp-kanban/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: Docker build smoke (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-kanban
          push: false

  plane-backend:
    name: Plane backend patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SLONK-32: сборка сама верифицирует патч — Dockerfile падает, если
      # storage.py не найден, не пропатчился или upstream изменил сигнатуру.
      # Держим это в CI, чтобы бамп PLANE_IMAGE_TAG ловился на PR, а не на
      # проде.
      - name: Read PLANE_IMAGE_TAG from .env.example
        id: plane
        run: |
          TAG=$(grep -E '^PLANE_IMAGE_TAG=' .env.example | cut -d= -f2)
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Docker build smoke (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./plane-backend
          push: false
          build-args: |
            PLANE_IMAGE_TAG=${{ steps.plane.outputs.tag }}

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-kanban
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: mcp-kanban/.nvmrc
          cache: pnpm
          cache-dependency-path: mcp-kanban/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
